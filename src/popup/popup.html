<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tend</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Tend</h1>
      <span id="summary"></span>
      <button id="settings-toggle" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3" />
          <path
            d="M8 1.8v2M8 12.2v2M14.2 8h-2M3.8 8h-2M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4M12.2 12.2l-1.4-1.4M5.2 5.2 3.8 3.8"
            stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </button>
    </header>
    <section id="settings-panel" class="settings-panel" hidden>
      <label id="theme-label">Theme</label>
      <div class="settings-row theme-row" role="radiogroup" aria-labelledby="theme-label">
        <button class="theme-option" type="button" data-theme-value="system">System</button>
        <button class="theme-option" type="button" data-theme-value="light">Light</button>
        <button class="theme-option" type="button" data-theme-value="dark">Dark</button>
      </div>

      <label for="api-key-input" class="settings-section-label">Anthropic API key (optional)</label>
      <div class="settings-row">
        <input id="api-key-input" type="password" placeholder="sk-ant-…" autocomplete="off" />
        <button id="api-key-save" type="button">Save</button>
      </div>
      <p class="settings-note">
        When set, each tab's title/URL/description is sent to Anthropic to group tabs by real
        purpose instead of keyword matching. This costs a small amount per use and is no longer
        fully local. Leave blank to keep everything on-device.
      </p>
      <p id="settings-status" class="settings-note"></p>
    </section>
    <main id="clusters">
      <p class="status">Grouping tabs… (the first run downloads a ~23 MB model)</p>
    </main>
    <template id="cluster-tpl">
      <section class="cluster">
        <h2><span class="label"></span> <span class="count"></span></h2>
        <ul></ul>
      </section>
    </template>
    <template id="tab-tpl">
      <li class="tab">
        <img class="favicon" alt="" width="16" height="16" />
        <button class="title" type="button">
          <span class="title-text"></span>
          <span class="host"></span>
        </button>
        <span class="score" aria-hidden="true"><span class="score-fill"></span></span>
        <button class="close" type="button" aria-label="Close tab" title="Close tab">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </li>
    </template>
    <script type="module" src="popup.js"></script>
  </body>
</html>
